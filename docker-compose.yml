services:
  ros2_jazzy:

    image: osrf/ros:jazzy-desktop
    container_name: ros2_jazzy_container
    
  
    command: sleep infinity
    
    network_mode: host
    ipc: host

    volumes:

      - .:/home/dev_ws

      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg


    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}